# PGS standalone LAN Apache config
# Runs as a SEPARATE httpd instance on port 8082 — does not touch the
# XAMPP service (no admin restart needed).
# Start:  C:\xampp\apache\bin\httpd.exe -f C:\xampp\htdocs\pgs\app\lan-apache\httpd-lan.conf -k start
# Stop:   C:\xampp\apache\bin\httpd.exe -f C:\xampp\htdocs\pgs\app\lan-apache\httpd-lan.conf -k stop
# Logs:   logs/error-lan.log, logs/access-lan.log (under this folder)

ServerRoot "C:/xampp/apache"
ServerName pgs-lan

PidFile "C:/xampp/htdocs/pgs/app/lan-apache/logs/httpd-lan.pid"
Listen 0.0.0.0:8082

# ---- modules (minimal set needed by Laravel public/.htaccess) ----
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule negotiation_module modules/mod_negotiation.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule filter_module modules/mod_filter.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule status_module modules/mod_status.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule actions_module modules/mod_actions.so
LoadModule mime_magic_module modules/mod_mime_magic.so

# ---- PHP 8.2 as an Apache module ----
PHPIniDir "C:/xampp/php"
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
AddType application/x-httpd-php .php

TypesConfig conf/mime.types

<IfModule mod_mime_magic.c>
    MIMEMagicFile "C:/xampp/apache/conf/magic"
</IfModule>

# ---- logging ----
ErrorLog "C:/xampp/htdocs/pgs/app/lan-apache/logs/error-lan.log"
LogLevel warn
<IfModule mod_log_config.c>
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    CustomLog "C:/xampp/htdocs/pgs/app/lan-apache/logs/access-lan.log" common
</IfModule>

<Directory />
    Require all denied
</Directory>

DocumentRoot "C:/xampp/htdocs/pgs/app/public"
<Directory "C:/xampp/htdocs/pgs/app/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    <IfModule mod_php.c>
        <FilesMatch "\.php$">
            SetHandler application/x-httpd-php
        </FilesMatch>
    </IfModule>
</Directory>

<Directory "C:/xampp/htdocs/pgs/app/public/storage">
    Require all granted
</Directory>

# ---- PHP-FPM not used; keep default charset handling ----
AddDefaultCharset UTF-8
