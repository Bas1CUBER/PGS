    const dropdownItem = submenu.querySelector(&#039;.dropdown-item&#039;);
    const dropdownMenu = submenu.querySelector(&#039;.dropdown-menu&#039;);

    if (dropdownItem &amp;&amp; dropdownMenu) {
      dropdownItem.addEventListener(&#039;click&#039;, function(e) {
        e.preventDefault(); // Prevent default link behavior
        e.stopPropagation(); // Prevent parent dropdown from closing

        // Toggle &#039;show&#039; class on the current submenu
        dropdownMenu.classList.toggle(&#039;show&#039;);

        // Close other open submenus at the same level
        submenu.parentElement.querySelectorAll(&#039;.dropdown-menu.show&#039;).forEach(function(openMenu) {
          if (openMenu !== dropdownMenu) {
            openMenu.classList.remove(&#039;show&#039;);
          }
        });
      });
    }
  });

  // Gate top-level dropdowns by access
  document.querySelectorAll(&#039;.nav-item.dropdown &gt; .nav-link.dropdown-toggle&#039;).forEach(function(link) {
    link.addEventListener(&#039;click&#039;, function(e) {
      var allowed = this.getAttribute(&#039;data-allowed&#039;);
      if (allowed === &#039;0&#039;) {
        e.preventDefault();
        e.stopPropagation();
        alert(&quot;You don&#039;t have access to this site. Contact administrator.&quot;);
      }
    });
  });

  // Block submenu item navigation when parent category is disallowed
  document.querySelectorAll(&#039;.nav-item.dropdown .dropdown-menu a.dropdown-item[href]&#039;).forEach(function(a) {
    a.addEventListener(&#039;click&#039;, function(e) {
      var topItem = this.closest(&#039;.nav-item.dropdown&#039;);
      if (!topItem) return;
      var toggle = topItem.querySelector(&#039;:scope &gt; .nav-link.dropdown-toggle&#039;);
      if (!toggle) return;
      var allowed = toggle.getAttribute(&#039;data-allowed&#039;);
      if (allowed === &#039;0&#039;) {
        e.preventDefault();
        e.stopPropagation();
        alert(&quot;You don&#039;t have access to this site. Contact administrator.&quot;);
      }
    });
  });

  // Close all submenus when clicking outside
  document.addEventListener(&#039;click&#039;, function(e) {
    if (!e.target.closest(&#039;.dropdown-submenu&#039;) &amp;&amp; !e.target.closest(&#039;.dropdown-toggle&#039;)) {
      document.querySelectorAll(&#039;.dropdown-submenu .dropdown-menu.show&#039;).forEach(function(menu) {
        menu.classList.remove(&#039;show&#039;);
      });
    }
  });

  // Ensure Bootstrap dropdowns close properly
  document.querySelectorAll(&#039;.dropdown-menu&#039;).forEach(function(menu) {

  // Notification System
  (function() {
    var badge = document.querySelector(&#039;.notification-badge&#039;);
    var notifList = document.getElementById(&#039;notificationList&#039;);
    var markAllReadBtn = document.getElementById(&#039;markAllReadBtn&#039;);
    var notifDropdown = document.getElementById(&#039;notificationDropdown&#039;);
    var isOpen = false;

    function getTypeIcon(type) {
      var icons = {
        &#039;upload&#039;: &#039;&lt;i data-lucide=&quot;upload&quot;&gt;&lt;/i&gt;&#039;,
        &#039;approved&#039;: &#039;&lt;i data-lucide=&quot;check&quot;&gt;&lt;/i&gt;&#039;,
        &#039;returned&#039;: &#039;&lt;i data-lucide=&quot;undo-2&quot;&gt;&lt;/i&gt;&#039;,
        &#039;edit&#039;: &#039;&lt;i data-lucide=&quot;pencil&quot;&gt;&lt;/i&gt;&#039;
      };
      return icons[type] || &#039;&lt;i data-lucide=&quot;bell&quot;&gt;&lt;/i&gt;&#039;;
    }

    function updateBadge(count) {
      if (count &gt; 0) {
        badge.textContent = count &gt; 99 ? &#039;99+&#039; : count;
        badge.style.display = &#039;block&#039;;
      } else {
        badge.style.display = &#039;none&#039;;
      }
    }

    function renderNotifications(notifications) {
      if (!notifications.length) {
        notifList.innerHTML = &#039;&lt;div class=&quot;text-center text-muted py-4&quot;&gt;&lt;i data-lucide=&quot;bell-off&quot; width=&quot;2em&quot; height=&quot;2em&quot; class=&quot;mb-2&quot;&gt;&lt;/i&gt;&lt;p class=&quot;mb-0 small&quot;&gt;No notifications yet&lt;/p&gt;&lt;/div&gt;&#039;;
        return;
      }

      var html = &#039;&#039;;
      notifications.forEach(function(n) {
        var unreadClass = n.is_read ? &#039;&#039; : &#039;unread&#039;;
        html += &#039;&lt;div class=&quot;notification-item &#039; + unreadClass + &#039;&quot; data-id=&quot;&#039; + n.id + &#039;&quot;&gt;&#039; +
          &#039;&lt;div class=&quot;d-flex align-items-start&quot;&gt;&#039; +
            &#039;&lt;div class=&quot;notification-type-icon &#039; + n.type + &#039; me-3&quot;&gt;&#039; + getTypeIcon(n.type) + &#039;&lt;/div&gt;&#039; +
            &#039;&lt;div class=&quot;flex-grow-1&quot;&gt;&#039; +
              &#039;&lt;div class=&quot;notification-title&quot;&gt;&#039; + escapeHtml(n.title) + &#039;&lt;/div&gt;&#039; +
              &#039;&lt;div class=&quot;notification-message&quot;&gt;&#039; + escapeHtml(n.message) + &#039;&lt;/div&gt;&#039; +
              &#039;&lt;div class=&quot;notification-time&quot;&gt;&#039; + n.time_ago + (n.related_type_display ? &#039; â€¢ &#039; + n.related_type_display : &#039;&#039;) + &#039;&lt;/div&gt;&#039; +
            &#039;&lt;/div&gt;&#039; +
          &#039;&lt;/div&gt;&#039; +
        &#039;&lt;/div&gt;&#039;;
      });
      notifList.innerHTML = html;

      // Add click handlers to mark as read
      notifList.querySelectorAll(&#039;.notification-item&#039;).forEach(function(item) {
        item.addEventListener(&#039;click&#039;, function() {
          var id = this.dataset.id;
          markAsRead(id);
          this.classList.remove(&#039;unread&#039;);
        });
      });
    }

    function escapeHtml(text) {
      var div = document.createElement(&#039;div&#039;);
      div.textContent = text;
      return div.innerHTML;
    }

    function fetchUnreadCount() {
      fetch(&#039;/notifications_api.php?action=get_unread_count&#039;)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok) updateBadge(data.count);
        })
        .catch(function() {});
    }

    function fetchNotifications() {
      fetch(&#039;/notifications_api.php?action=get_notifications&#039;)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok) {
            renderNotifications(data.notifications);
            // Update badge with unread count from notifications
            var unreadCount = data.notifications.filter(function(n) { return !n.is_read; }).length;
            updateBadge(unreadCount);
          }
        })
        .catch(function() {});
    }

    function markAsRead(id) {
      var fd = new FormData();
      fd.append(&#039;action&#039;, &#039;mark_read&#039;);
      fd.append(&#039;id&#039;, id);
      fetch(&#039;/notifications_api.php&#039;, { method: &#039;POST&#039;, body: fd })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok) fetchUnreadCount();
        })
        .catch(function() {});
    }

    function markAllRead() {
      var fd = new FormData();
      fd.append(&#039;action&#039;, &#039;mark_all_read&#039;);
      fetch(&#039;/notifications_api.php&#039;, { method: &#039;POST&#039;, body: fd })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok) {
            fetchNotifications();
            fetchUnreadCount();
          }
        })
        .catch(function() {});
    }

    // Event listeners
    if (markAllReadBtn) {
      markAllReadBtn.addEventListener(&#039;click&#039;, function(e) {
        e.stopPropagation();
        markAllRead();
      });
    }

    // Fetch notifications when dropdown opens
    if (notifDropdown) {
      notifDropdown.addEventListener(&#039;shown.bs.dropdown&#039;, function() {
        isOpen = true;
        fetchNotifications();
      });
      notifDropdown.addEventListener(&#039;hidden.bs.dropdown&#039;, function() {
        isOpen = false;
      });
    }

    // Initial fetch
    fetchUnreadCount();

    // Poll for new notifications every 30 seconds
    setInterval(fetchUnreadCount, 30000);
  })();

  // Click-based toggling for submenus and nested submenus
  document.querySelectorAll(&#039;.dropdown-submenu&#039;).forEach(function(submenu) {
    const dropdownItem = submenu.querySelector(&#039;.dropdown-item&#039;);
    const dropdownMenu = submenu.querySelector(&#039;.dropdown-menu&#039;);

    if (dropdownItem &amp;&amp; dropdownMenu) {
      dropdownItem.addEventListener(&#039;click&#039;, function(e) {
        e.preventDefault(); // Prevent default link behavior
        e.stopPropagation(); // Prevent parent dropdown from closing

        // Toggle &#039;show&#039; class on the current submenu
        dropdownMenu.classList.toggle(&#039;show&#039;);

        // Close other open submenus at the same level
        submenu.parentElement.querySelectorAll(&#039;.dropdown-menu.show&#039;).forEach(function(openMenu) {
          if (openMenu !== dropdownMenu) {
            openMenu.classList.remove(&#039;show&#039;);
          }
        });
      });
    }
  });

  // Gate top-level dropdowns by access
  document.querySelectorAll(&#039;.nav-item.dropdown &gt; .nav-link.dropdown-toggle&#039;).forEach(function(link) {
    link.addEventListener(&#039;click&#039;, function(e) {
      var allowed = this.getAttribute(&#039;data-allowed&#039;);
      if (allowed === &#039;0&#039;) {
        e.preventDefault();
        e.stopPropagation();
        alert(&quot;You don&#039;t have access to this site. Contact administrator.&quot;);
      }
    });
  });

  // Block submenu item navigation when parent category is disallowed
  document.querySelectorAll(&#039;.nav-item.dropdown .dropdown-menu a.dropdown-item[href]&#039;).forEach(function(a) {
    a.addEventListener(&#039;click&#039;, function(e) {
      var topItem = this.closest(&#039;.nav-item.dropdown&#039;);
      if (!topItem) return;
      var toggle = topItem.querySelector(&#039;:scope &gt; .nav-link.dropdown-toggle&#039;);
      if (!toggle) return;
      var allowed = toggle.getAttribute(&#039;data-allowed&#039;);
      if (allowed === &#039;0&#039;) {
        e.preventDefault();
        e.stopPropagation();
        alert(&quot;You don&#039;t have access to this site. Contact administrator.&quot;);
      }
    });
  });

  // Close all submenus when clicking outside
  document.addEventListener(&#039;click&#039;, function(e) {
    if (!e.target.closest(&#039;.dropdown-submenu&#039;) &amp;&amp; !e.target.closest(&#039;.dropdown-toggle&#039;)) {
      document.querySelectorAll(&#039;.dropdown-submenu .dropdown-menu.show&#039;).forEach(function(menu) {
        menu.classList.remove(&#039;show&#039;);
      });
    }
  });

  // Ensure Bootstrap dropdowns close properly
  document.querySelectorAll(&#039;.dropdown-menu&#039;).forEach(function(menu) {
    menu.addEventListener(&#039;click&#039;, function(e) {
      e.stopPropagation(); // Prevent dropdown from closing when clicking inside
    });
  });

  // Notification System
  (function() {
    var badge = document.querySelector(&#039;.notification-badge&#039;);
    var notifList = document.getElementById(&#039;notificationList&#039;);
    var markAllReadBtn = document.getElementById(&#039;markAllReadBtn&#039;);
    var notifDropdown = document.getElementById(&#039;notificationDropdown&#039;);
    var isOpen = false;

    function getTypeIcon(type) {
      var icons = {
        &#039;upload&#039;: &#039;&lt;i data-lucide=&quot;upload&quot;&gt;&lt;/i&gt;&#039;,
        &#039;approved&#039;: &#039;&lt;i data-lucide=&quot;check&quot;&gt;&lt;/i&gt;&#039;,
        &#039;returned&#039;: &#039;&lt;i data-lucide=&quot;undo-2&quot;&gt;&lt;/i&gt;&#039;,
        &#039;edit&#039;: &#039;&lt;i data-lucide=&quot;pencil&quot;&gt;&lt;/i&gt;&#039;
      };
      return icons[type] || &#039;&lt;i data-lucide=&quot;bell&quot;&gt;&lt;/i&gt;&#039;;
    }

    function updateBadge(count) {
      if (count &gt; 0) {
        badge.textContent = count &gt; 99 ? &#039;99+&#039; : count;
        badge.style.display = &#039;block&#039;;
      } else {
        badge.style.display = &#039;none&#039;;
      }
    }

    function renderNotifications(notifications) {
      if (!notifications.length) {
        notifList.innerHTML = &#039;&lt;div class=&quot;text-center text-muted py-4&quot;&gt;&lt;i data-lucide=&quot;bell-off&quot; width=&quot;2em&quot; height=&quot;2em&quot; class=&quot;mb-2&quot;&gt;&lt;/i&gt;&lt;p class=&quot;mb-0 small&quot;&gt;No notifications yet&lt;/p&gt;&lt;/div&gt;&#039;;
        return;
      }

      var html = &#039;&#039;;
      notifications.forEach(function(n) {
        var unreadClass = n.is_read ? &#039;&#039; : &#039;unread&#039;;
        html += &#039;&lt;div class=&quot;notification-item &#039; + unreadClass + &#039;&quot; data-id=&quot;&#039; + n.id + &#039;&quot;&gt;&#039; +
          &#039;&lt;div class=&quot;d-flex align-items-start&quot;&gt;&#039; +
            &#039;&lt;div class=&quot;notification-type-icon &#039; + n.type + &#039; me-3&quot;&gt;&#039; + getTypeIcon(n.type) + &#039;&lt;/div&gt;&#039; +
            &#039;&lt;div class=&quot;flex-grow-1&quot;&gt;&#039; +
              &#039;&lt;div class=&quot;notification-title&quot;&gt;&#039; + escapeHtml(n.title) + &#039;&lt;/div&gt;&#039; +
              &#039;&lt;div class=&quot;notification-message&quot;&gt;&#039; + escapeHtml(n.message) + &#039;&lt;/div&gt;&#039; +
              &#039;&lt;div class=&quot;notification-time&quot;&gt;&#039; + n.time_ago + (n.related_type_display ? &#039; â€¢ &#039; + n.related_type_display : &#039;&#039;) + &#039;&lt;/div&gt;&#039; +
            &#039;&lt;/div&gt;&#039; +
          &#039;&lt;/div&gt;&#039; +
        &#039;&lt;/div&gt;&#039;;
      });
      notifList.innerHTML = html;

      // Add click handlers to mark as read
      notifList.querySelectorAll(&#039;.notification-item&#039;).forEach(function(item) {
        item.addEventListener(&#039;click&#039;, function() {
          var id = this.dataset.id;
          markAsRead(id);
          this.classList.remove(&#039;unread&#039;);
        });
      });
    }

    function escapeHtml(text) {
      var div = document.createElement(&#039;div&#039;);
      div.textContent = text;
      return div.innerHTML;
    }

    function fetchUnreadCount() {
      fetch(&#039;/notifications_api.php?action=get_unread_count&#039;)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok) updateBadge(data.count);
        })
        .catch(function() {});
    }

    function fetchNotifications() {
      fetch(&#039;/notifications_api.php?action=get_notifications&#039;)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok) {
            renderNotifications(data.notifications);
            // Update badge with unread count from notifications
            var unreadCount = data.notifications.filter(function(n) { return !n.is_read; }).length;
            updateBadge(unreadCount);
          }
        })
        .catch(function() {});
    }

    function markAsRead(id) {
      var fd = new FormData();
      fd.append(&#039;action&#039;, &#039;mark_read&#039;);
      fd.append(&#039;id&#039;, id);
      fetch(&#039;/notifications_api.php&#039;, { method: &#039;POST&#039;, body: fd })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok) fetchUnreadCount();
        })
        .catch(function() {});
    }

    function markAllRead() {
      var fd = new FormData();
      fd.append(&#039;action&#039;, &#039;mark_all_read&#039;);
      fetch(&#039;/notifications_api.php&#039;, { method: &#039;POST&#039;, body: fd })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok) {
            fetchNotifications();
            fetchUnreadCount();
          }
        })
        .catch(function() {});
    }

    // Event listeners
    if (markAllReadBtn) {
      markAllReadBtn.addEventListener(&#039;click&#039;, function(e) {
        e.stopPropagation();
        markAllRead();
      });
    }

    // Fetch notifications when dropdown opens
    if (notifDropdown) {
      notifDropdown.addEventListener(&#039;shown.bs.dropdown&#039;, function() {
        isOpen = true;
        fetchNotifications();
      });
      notifDropdown.addEventListener(&#039;hidden.bs.dropdown&#039;, function() {
        isOpen = false;
      });
    }

    // Initial fetch
    fetchUnreadCount();

    // Poll for new notifications every 30 seconds
    setInterval(fetchUnreadCount, 30000);
  })();
&lt;/script&gt;

&lt;script&gt;
  // Click-based toggling for submenus and nested submenus
  document.querySelectorAll(&#039;.dropdown-submenu&#039;).forEach(function(submenu) {
    const dropdownItem = submenu.querySelector(&#039;.dropdown-item&#039;);
    const dropdownMenu = submenu.querySelector(&#039;.dropdown-menu&#039;);

    if (dropdownItem &amp;&amp; dropdownMenu) {
      dropdownItem.addEventListener(&#039;click&#039;, function(e) {
        e.preventDefault(); // Prevent default link behavior
        e.stopPropagation(); // Prevent parent dropdown from closing

        // Toggle &#039;show&#039; class on the current submenu
        dropdownMenu.classList.toggle(&#039;show&#039;);

        // Close other open submenus at the same level
        submenu.parentElement.querySelectorAll(&#039;.dropdown-menu.show&#039;).forEach(function(openMenu) {
          if (openMenu !== dropdownMenu) {
            openMenu.classList.remove(&#039;show&#039;);
          }
        });
      });
    }
  });

  // Gate top-level dropdowns by access
  document.querySelectorAll(&#039;.nav-item.dropdown &gt; .nav-link.dropdown-toggle&#039;).forEach(function(link) {
    link.addEventListener(&#039;click&#039;, function(e) {
      var allowed = this.getAttribute(&#039;data-allowed&#039;);
      if (allowed === &#039;0&#039;) {
        e.preventDefault();
        e.stopPropagation();
        alert(&quot;You don&#039;t have access to this site. Contact administrator.&quot;);
      }
    });
  });

  // Block submenu item navigation when parent category is disallowed
  document.querySelectorAll(&#039;.nav-item.dropdown .dropdown-menu a.dropdown-item[href]&#039;).forEach(function(a) {
    a.addEventListener(&#039;click&#039;, function(e) {
      var topItem = this.closest(&#039;.nav-item.dropdown&#039;);
      if (!topItem) return;
      var toggle = topItem.querySelector(&#039;:scope &gt; .nav-link.dropdown-toggle&#039;);
      if (!toggle) return;
      var allowed = toggle.getAttribute(&#039;data-allowed&#039;);
      if (allowed === &#039;0&#039;) {
        e.preventDefault();
        e.stopPropagation();
        alert(&quot;You don&#039;t have access to this site. Contact administrator.&quot;);
      }
    });
  });

  // Close all submenus when clicking outside
  document.addEventListener(&#039;click&#039;, function(e) {
    if (!e.target.closest(&#039;.dropdown-submenu&#039;) &amp;&amp; !e.target.closest(&#039;.dropdown-toggle&#039;)) {
      document.querySelectorAll(&#039;.dropdown-submenu .dropdown-menu.show&#039;).forEach(function(menu) {
        menu.classList.remove(&#039;show&#039;);
      });
    }
  });

  // Ensure Bootstrap dropdowns close properly
  document.querySelectorAll(&#039;.dropdown-menu&#039;).forEach(function(menu) {
    menu.addEventListener(&#039;click&#039;, function(e) {
      e.stopPropagation(); // Prevent dropdown from closing when clicking inside
    });
  });

  // Notification System
  (function() {
    var badge = document.querySelector(&#039;.notification-badge&#039;);
    var notifList = document.getElementById(&#039;notificationList&#039;);
    var markAllReadBtn = document.getElementById(&#039;markAllReadBtn&#039;);
    var notifDropdown = document.getElementById(&#039;notificationDropdown&#039;);
    var isOpen = false;

    function getTypeIcon(type) {
      var icons = {
        &#039;upload&#039;: &#039;&lt;i data-lucide=&quot;upload&quot;&gt;&lt;/i&gt;&#039;,
        &#039;approved&#039;: &#039;&lt;i data-lucide=&quot;check&quot;&gt;&lt;/i&gt;&#039;,
        &#039;returned&#039;: &#039;&lt;i data-lucide=&quot;undo-2&quot;&gt;&lt;/i&gt;&#039;,
        &#039;edit&#039;: &#039;&lt;i data-lucide=&quot;pencil&quot;&gt;&lt;/i&gt;&#039;
      };
      return icons[type] || &#039;&lt;i data-lucide=&quot;bell&quot;&gt;&lt;/i&gt;&#039;;
    }

    function updateBadge(count) {
      if (count &gt; 0) {
        badge.textContent = count &gt; 99 ? &#039;99+&#039; : count;
        badge.style.display = &#039;block&#039;;
      } else {
        badge.style.display = &#039;none&#039;;
      }
    }

    function renderNotifications(notifications) {
      if (!notifications.length) {
        notifList.innerHTML = &#039;&lt;div class=&quot;text-center text-muted py-4&quot;&gt;&lt;i data-lucide=&quot;bell-off&quot; width=&quot;2em&quot; height=&quot;2em&quot; class=&quot;mb-2&quot;&gt;&lt;/i&gt;&lt;p class=&quot;mb-0 small&quot;&gt;No notifications yet&lt;/p&gt;&lt;/div&gt;&#039;;
        return;
      }

      var html = &#039;&#039;;
      notifications.forEach(function(n) {

            &#039;&lt;/div&gt;&#039; +
          &#039;&lt;/div&gt;&#039; +
        &#039;&lt;/div&gt;&#039;;
      });

        .then(function(data) {

      fd.append(&#039;action&#039;, &#039;mark_all_read&#039;);
      fetch(&#039;/notifications_api.php&#039;, { method: &#039;POST&#039;, body: fd })

          if (data.ok) {
            fetchNotifications();
            fetchUnreadCount();
          }

&lt;script&gt;
  // Click-based toggling for submenus and nested submenus
  document.querySelectorAll(&#039;.dropdown-submenu&#039;).forEach(function(submenu) {
    const dropdownItem = submenu.querySelector(&#039;.dropdown-item&#039;);
    const dropdownMenu = submenu.querySelector(&#039;.dropdown-menu&#039;);

    if (dropdownItem &amp;&amp; dropdownMenu) {
      dropdownItem.addEventListener(&#039;click&#039;, function(e) {
        e.preventDefault(); // Prevent default link behavior
        e.stopPropagation(); // Prevent parent dropdown from closing

        // Toggle &#039;show&#039; class on the current submenu
        dropdownMenu.classList.toggle(&#039;show&#039;);

        // Close other open submenus at the same level
        submenu.parentElement.querySelectorAll(&#039;.dropdown-menu.show&#039;).forEach(function(openMenu) {
          if (openMenu !== dropdownMenu) {
            openMenu.classList.remove(&#039;show&#039;);
          }
        });
      });
    }
  });

  // Gate top-level dropdowns by access
  document.querySelectorAll(&#039;.nav-item.dropdown &gt; .nav-link.dropdown-toggle&#039;).forEach(function(link) {
    link.addEventListener(&#039;click&#039;, function(e) {
      var allowed = this.getAttribute(&#039;data-allowed&#039;);
      if (allowed === &#039;0&#039;) {
        e.preventDefault();
        e.stopPropagation();
        alert(&quot;You don&#039;t have access to this site. Contact administrator.&quot;);
      }
    });
  });

  // Block submenu item navigation when parent category is disallowed
  document.querySelectorAll(&#039;.nav-item.dropdown .dropdown-menu a.dropdown-item[href]&#039;).forEach(function(a) {
    a.addEventListener(&#039;click&#039;, function(e) {
      var topItem = this.closest(&#039;.nav-item.dropdown&#039;);
      if (!topItem) return;
      var toggle = topItem.querySelector(&#039;:scope &gt; .nav-link.dropdown-toggle&#039;);
      if (!toggle) return;
      var allowed = toggle.getAttribute(&#039;data-allowed&#039;);
      if (allowed === &#039;0&#039;) {
        e.preventDefault();
        e.stopPropagation();
        alert(&quot;You don&#039;t have access to this site. Contact administrator.&quot;);
      }
    });
  });

  // Close all submenus when clicking outside
  document.addEventListener(&#039;click&#039;, function(e) {
    if (!e.target.closest(&#039;.dropdown-submenu&#039;) &amp;&amp; !e.target.closest(&#039;.dropdown-toggle&#039;)) {
      document.querySelectorAll(&#039;.dropdown-submenu .dropdown-menu.show&#039;).forEach(function(menu) {
        menu.classList.remove(&#039;show&#039;);
      });
    }
  });

  // Ensure Bootstrap dropdowns close properly
  document.querySelectorAll(&#039;.dropdown-menu&#039;).forEach(function(menu) {
    menu.addEventListener(&#039;click&#039;, function(e) {
      e.stopPropagation(); // Prevent dropdown from closing when clicking inside
    });
  });

  // Notification System
  (function() {
    var badge = document.querySelector(&#039;.notification-badge&#039;);
    var notifList = document.getElementById(&#039;notificationList&#039;);
    var markAllReadBtn = document.getElementById(&#039;markAllReadBtn&#039;);
    var notifDropdown = document.getElementById(&#039;notificationDropdown&#039;);
    var isOpen = false;

    function getTypeIcon(type) {
      var icons = {
        &#039;upload&#039;: &#039;&lt;i data-lucide=&quot;upload&quot;&gt;&lt;/i&gt;&#039;,
        &#039;approved&#039;: &#039;&lt;i data-lucide=&quot;check&quot;&gt;&lt;/i&gt;&#039;,
        &#039;returned&#039;: &#039;&lt;i data-lucide=&quot;undo-2&quot;&gt;&lt;/i&gt;&#039;,
        &#039;edit&#039;: &#039;&lt;i data-lucide=&quot;pencil&quot;&gt;&lt;/i&gt;&#039;
      };
      return icons[type] || &#039;&lt;i data-lucide=&quot;bell&quot;&gt;&lt;/i&gt;&#039;;
    }

    function updateBadge(count) {
      if (count &gt; 0) {
        badge.textContent = count &gt; 99 ? &#039;99+&#039; : count;
        badge.style.display = &#039;block&#039;;
      } else {
        badge.style.display = &#039;none&#039;;
      }
    }

    function renderNotifications(notifications) {
      if (!notifications.length) {
        notifList.innerHTML = &#039;&lt;div class=&quot;text-center text-muted py-4&quot;&gt;&lt;i data-lucide=&quot;bell-off&quot; width=&quot;2em&quot; height=&quot;2em&quot; class=&quot;mb-2&quot;&gt;&lt;/i&gt;&lt;p class=&quot;mb-0 small&quot;&gt;No notifications yet&lt;/p&gt;&lt;/div&gt;&#039;;
        return;
      }

      var html = &#039;&#039;;
      notifications.forEach(function(n) {
        var unreadClass = n.is_read ? &#039;&#039; : &#039;unread&#039;;
        html += &#039;&lt;div class=&quot;notification-item &#039; + unreadClass + &#039;&quot; data-id=&quot;&#039; + n.id + &#039;&quot;&gt;&#039; +
          &#039;&lt;div class=&quot;d-flex align-items-start&quot;&gt;&#039; +
            &#039;&lt;div class=&quot;notification-type-icon &#039; + n.type + &#039; me-3&quot;&gt;&#039; + getTypeIcon(n.type) + &#039;&lt;/div&gt;&#039; +
            &#039;&lt;div class=&quot;flex-grow-1&quot;&gt;&#039; +
              &#039;&lt;div class=&quot;notification-title&quot;&gt;&#039; + escapeHtml(n.title) + &#039;&lt;/div&gt;&#039; +
              &#039;&lt;div class=&quot;notification-message&quot;&gt;&#039; + escapeHtml(n.message) + &#039;&lt;/div&gt;&#039; +
              &#039;&lt;div class=&quot;notification-time&quot;&gt;&#039; + n.time_ago + (n.related_type_display ? &#039; â€¢ &#039; + n.related_type_display : &#039;&#039;) + &#039;&lt;/div&gt;&#039; +
            &#039;&lt;/div&gt;&#039; +
          &#039;&lt;/div&gt;&#039; +
        &#039;&lt;/div&gt;&#039;;
      });
      notifList.innerHTML = html;

      // Add click handlers to mark as read
      notifList.querySelectorAll(&#039;.notification-item&#039;).forEach(function(item) {
        item.addEventListener(&#039;click&#039;, function() {
          var id = this.dataset.id;
          markAsRead(id);
          this.classList.remove(&#039;unread&#039;);
        });
      });
    }

    function escapeHtml(text) {
      var div = document.createElement(&#039;div&#039;);
      div.textContent = text;
      return div.innerHTML;
    }

    function fetchUnreadCount() {
      fetch(&#039;/notifications_api.php?action=get_unread_count&#039;)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok) updateBadge(data.count);
        })
        .catch(function() {});
    }

    function fetchNotifications() {
      fetch(&#039;/notifications_api.php?action=get_notifications&#039;)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok) {
            renderNotifications(data.notifications);
            // Update badge with unread count from notifications
            var unreadCount = data.notifications.filter(function(n) { return !n.is_read; }).length;
            updateBadge(unreadCount);
          }
        })
        .catch(function() {});
    }

    function markAsRead(id) {
      var fd = new FormData();
      fd.append(&#039;action&#039;, &#039;mark_read&#039;);
      fd.append(&#039;id&#039;, id);
      fetch(&#039;/notifications_api.php&#039;, { method: &#039;POST&#039;, body: fd })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok) fetchUnreadCount();
        })
        .catch(function() {});
    }

    function markAllRead() {
      var fd = new FormData();
      fd.append(&#039;action&#039;, &#039;mark_all_read&#039;);
      fetch(&#039;/notifications_api.php&#039;, { method: &#039;POST&#039;, body: fd })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok) {
            fetchNotifications();
            fetchUnreadCount();
          }
        })
        .catch(function() {});
    }

    // Event listeners
    if (markAllReadBtn) {

    if (notifDropdown) {

        isOpen = true;
        fetchNotifications();
      });
      notifDropdown.addEventListener(&#039;hidden.bs.dropdown&#039;, function() {

      });
    }

    fetchUnreadCount();
